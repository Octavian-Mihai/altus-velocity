name: Altus
options:
  bundleIdPrefix: com.octavianmihai.altus
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  AltusKit:
    path: Packages/AltusKit

targets:
  AltusApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AltusApp
    dependencies:
      - package: AltusKit
        product: AltusKit
      - target: AltusWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.octavianmihai.altus
        PRODUCT_NAME: Altus
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: AltusApp/Info.plist
      properties:
        NSHealthShareUsageDescription: "Altus reads workout data to show jump and lift history from Apple Health."
        NSHealthUpdateUsageDescription: "Altus saves jump test and lift sessions to Apple Health so they appear alongside your other workouts."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  AltusWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: AltusWatch
    dependencies:
      - package: AltusKit
        product: AltusKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.octavianmihai.altus.watchkitapp
        PRODUCT_NAME: Altus
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        SKIP_INSTALL: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: AltusWatch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.octavianmihai.altus
        NSHealthShareUsageDescription: "Altus uses workout sessions to keep motion sensors active during a jump test or lift set."
        NSHealthUpdateUsageDescription: "Altus saves jump test and lift sessions to Apple Health so they appear alongside your other workouts."
        NSMotionUsageDescription: "Altus uses motion data to measure jump height and lift velocity in real time."
        WKRunsIndependentlyOfCompanionApp: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
